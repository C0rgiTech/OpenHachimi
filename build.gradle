plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                // Used by the native injector's call to instrument.dll Agent_OnAttach.
                'Agent-Class'             : 'dev.openhachimi.security.InjectAgent'
        ])
    }
    finalizedBy 'reobfJar'
}

def nativeDllDir = file('native/dll')
def nativeDllBuildDir = file('native/build-dll')
def nativeDllOutput = file('native/build-dll/bin/OpenHachimi.dll')
def injectorBuildDir = file('native/build-injector')
def injectorOutput = file('native/build-injector/bin/OpenHachimiInject.exe')
def cmakeCommand = System.getenv('CMAKE') ?: 'cmake'
def nativeJavaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')

tasks.register('configureNativeDll', Exec) {
    group = 'native'
    description = 'Configures the Windows bootstrap DLL and embeds the built mod jar.'
    dependsOn tasks.named('build')
    workingDir projectDir
    environment 'JAVA_HOME', nativeJavaHome
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    inputs.files(fileTree('native/dll'))
    outputs.file(file('native/build-dll/CMakeCache.txt'))

    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            throw new GradleException('The native injector currently requires Windows and MSVC.')
        }
        if (!nativeJavaHome || !file("${nativeJavaHome}/include/jni.h").exists()) {
            throw new GradleException("JAVA_HOME must point to a JDK containing include/jni.h (current: ${nativeJavaHome})")
        }
        def jarPath = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!jarPath.exists()) {
            throw new GradleException("Mod jar not found: ${jarPath}")
        }
        commandLine cmakeCommand,
                '-S', nativeDllDir.absolutePath,
                '-B', nativeDllBuildDir.absolutePath,
                "-DJAR_SOURCE=${jarPath.absolutePath.replace('\\', '/')}",
                '-DCMAKE_BUILD_TYPE=Release'
    }
}

tasks.register('buildNativeDll', Exec) {
    group = 'native'
    description = 'Builds the Windows DLL that loads OpenHachimi into a running Minecraft JVM.'
    dependsOn tasks.named('configureNativeDll')
    workingDir projectDir
    environment 'JAVA_HOME', nativeJavaHome
    inputs.files(fileTree('native/dll'))
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    outputs.file(nativeDllOutput)

    doFirst {
        commandLine cmakeCommand,
                '--build', nativeDllBuildDir.absolutePath,
                '--config', 'Release',
                '--target', 'OpenHachimi',
                '--parallel'
    }
}

tasks.register('buildDll') {
    group = 'native'
    description = 'Builds the native injection DLL.'
    dependsOn tasks.named('buildNativeDll')
}

tasks.register('builddll') {
    group = 'native'
    description = 'Alias for buildDll.'
    dependsOn tasks.named('buildDll')
}

tasks.register('configureInjector', Exec) {
    group = 'native'
    description = 'Configures the command-line Windows injector.'
    workingDir projectDir
    inputs.files(fileTree('native/injector'))
    outputs.file(file('native/build-injector/CMakeCache.txt'))

    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            throw new GradleException('The command-line injector currently requires Windows and MSVC.')
        }
        commandLine cmakeCommand,
                '-S', file('native/injector').absolutePath,
                '-B', injectorBuildDir.absolutePath,
                '-DCMAKE_BUILD_TYPE=Release'
    }
}

tasks.register('buildInjector', Exec) {
    group = 'native'
    description = 'Builds the command-line Windows injector.'
    dependsOn tasks.named('configureInjector')
    workingDir projectDir
    inputs.files(fileTree('native/injector'))
    outputs.file(injectorOutput)

    doFirst {
        commandLine cmakeCommand,
                '--build', injectorBuildDir.absolutePath,
                '--config', 'Release',
                '--target', 'OpenHachimiInject',
                '--parallel'
    }
}

tasks.register('packageInject', Zip) {
    group = 'distribution'
    description = 'Packages the mod jar, native DLL, and injector into one zip.'
    dependsOn tasks.named('buildDll'), tasks.named('buildInjector')
    archiveBaseName = 'OpenHachimi-Inject'
    archiveVersion = '1.20.1'
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(tasks.named('jar', Jar).flatMap { it.archiveFile }) {
        into 'OpenHachimi-Inject-1.20.1'
        rename { 'openhachimi-1.0.0.jar' }
    }
    from(nativeDllOutput) { into 'OpenHachimi-Inject-1.20.1' }
    from(injectorOutput) { into 'OpenHachimi-Inject-1.20.1' }
    from('tools/INJECT_README.txt') {
        into 'OpenHachimi-Inject-1.20.1'
        rename { 'README.txt' }
    }
}

